    <section id="panel-work" role="tabpanel" aria-labelledby="tab-work" data-about-panel="work"><h3>城市不止一种回答</h3><p>同一场雨，可以沿着硬质街道迅速汇流，也可以经过屋顶、花园、湿地和地下调蓄设施，被缓缓接住。《潮生》让这些通常看不见的过程，成为可以观察和比较的空间关系。</p><h3>一座虚构的滨水街区</h3><p>建筑、道路、水系与设施均为本作品的程序化场景。构图采用建筑沙盘表达，场景尺寸与计算面积不按工程比例对应，不代表真实地块或已建项目。</p><p class="about-note">AIGC 与可视化创作 · 个人大学生组创作方向</p></section>
    <section id="panel-model" role="tabpanel" aria-labelledby="tab-model" data-about-panel="model" hidden><h3>1 分钟过程雨洪模型</h3><p>把一场雨拆成 1 分钟的时间步。滑块设定的是时段平均雨强，模型按单峰概化雨型把它分配到每一分钟，峰值约为平均值的 2.7 倍。每一步先按径流系数把雨量分成下渗与径流，再让调蓄设施与排水管网竞争这一分钟的来水。</p><div class="formula">每分钟来水 = 雨强 × 面积 × 1 min<br>径流 = 每分钟来水 × 场景径流系数<br>溢流 = max(0, 蓄水 − 调蓄容量)</div><p>右侧过程线展示逐分钟的降雨、管网外排、地表溢流与调蓄蓄水率，雨停后继续演算退水直到调蓄设施排空。传统街区与海绵街区在同一场雨下分别演算，“峰值溢流削减”由两者的峰值溢流直接比较得到，不等同于真实工程洪峰削减。</p><p class="about-note">本作品用于概念教育，不构成工程设计依据或灾害预报。</p><h3>设施滞蓄分解</h3><p>整场雨的调蓄容量按作品设定的比例分摊到四类设施：雨水花园 30%、地下蓄水 40%、城市湿地 18%、屋顶绿洲 12%。点开任一设施详情，即可看到它在当前参数下分担的滞蓄量。这一分配用于说明"每一处设施都在分担这场雨"，不代表真实工程的容量配比。</p><h3>降雨等级</h3><p>实验面板按时段平均雨强给出等级：小雨 &lt;2.5、中雨 &lt;8、大雨 &lt;16、暴雨 &lt;32、大暴雨 &lt;64、特大暴雨 ≥64 mm/h。当概化雨型的峰值达到 20 mm/h 时，额外标注"短时强降水"。</p><h3>过程线怎么读</h3><h3>设计暴雨与重现期</h3><p>模型内置了日常、2年一遇、5年一遇、50年一遇四类设计暴雨预设。重现期并非实时气象预报，而是基于降雨总量与历时的经验对照，帮助理解不同强度下海绵街区的响应差异。</p><h3>成效评估等级</h3><p>“海绵成效”卡片根据当前工况给出 S/A/B/C 四级评价：S 表示滞蓄与削峰均表现优异；A 表示洪峰削减显著；B 表示仍有提升空间；C 表示已出现地表溢流，需增加调蓄或绿色空间。</p><p>顶部灰色带是降雨时程，中间实心区是这一分钟排入管网的水量，其上的橙色区是超出管网能力、转为地表溢流的部分，虚线为调蓄设施的蓄水率。琥珀色虚线是同一场雨下传统街区的出流过程，与实心区的落差即为海绵街区的削峰效果；雨停后的尾部是退水段。将鼠标移到图上可读取任意一分钟的读数。</p><h3>概念来源</h3><ul class="source-links">${ys.sources.map(i=>`<li><a href="${i.url}" target="_blank" rel="noreferrer">${i.title}${he("arrow-up-right")}</a></li>`).join("")}</ul></section>
    <section id="panel-creation" role="tabpanel" aria-labelledby="tab-creation" data-about-panel="creation" hidden><h3>AIGC 参与方式</h3><p>本作品在创作者的题材与审美要求下，借助 AI 编程助手生成并迭代叙事、界面、三维场景代码和简化计算模型。建筑、植物与材质由代码构建；未使用实地扫描、真实传感器接入或文生三维模型。</p><h3>技术与署名</h3><p>实时三维使用 Three.js（MIT），图标使用 Lucide（ISC，含 Feather 的 MIT 内容）。代码、模型设定、交互与创作说明随作品保留，参赛署名须由实际创作者据实填写。</p><button class="download-report" id="download-report">${he("download")}导出当前实验记录</button></section>

    <div id="app" data-page-node-id="YHpsAuYUsOnJyzo5y0fBlH"></div>
    <script>
// 手机适配层：仅触屏设备生效；桌面环境首行即退出，不添加任何监听
(function(){
  if(!window.matchMedia('(pointer: coarse)').matches) return;
  // 阻止 iOS 页面捏合缩放（3D 交互场景）
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  window.addEventListener('load', function(){
    var canvas = document.querySelector('#city-canvas');
    if(canvas) canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    // 首次进入的操作提示（每次会话一次）
    try{ if(sessionStorage.getItem('tidalMobileHint')) return; }catch(e){}
    var t0 = Date.now();
    (function poll(){
      var ls = document.querySelector('.loading-screen');
      var ready = ls && (ls.hidden || getComputedStyle(ls).display === 'none');
      if(!ready){
        if(Date.now() - t0 < 20000) setTimeout(poll, 300);
        return;
      }
      setTimeout(function(){
        var el = document.createElement('div');
        el.className = 'mobile-hint';
        el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>\u5355\u6307\u62d6\u52a8\u65cb\u8f6c \u00b7 \u53cc\u6307\u7f29\u653e';
        document.body.appendChild(el);
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('show'); }); });
        try{ sessionStorage.setItem('tidalMobileHint', '1'); }catch(e){}
        var dismissed = false;
        function dismiss(){
          if(dismissed) return;
          dismissed = true;
          el.classList.remove('show');
          setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 600);
        }
        // 切换视角/开始拖拽时提前收回提示，避免遮挡交互面板
        document.addEventListener('click', function(e){
          if(e.target && e.target.closest && e.target.closest('.view-tabs button')) dismiss();
        }, true);
        canvas.addEventListener('pointerdown', dismiss, { once: true });
        setTimeout(dismiss, 5200);
      }, 900);
    })();
  });
})();
    </script>
  </body>
</html>
